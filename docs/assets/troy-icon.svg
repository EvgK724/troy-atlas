<title id="icon-title">TROY — ворота цитадели</title><desc id="icon-desc">Оригинальная эмблема: крупные ворота и наклонные стены, бирюзовый камень и янтарный проход. Условный знак, не реконструкция конкретных ворот Трои.</desc>
