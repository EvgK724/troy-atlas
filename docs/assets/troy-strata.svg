<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="strata-title strata-desc">
<title id="strata-title">Девять основных археологических периодов Трои</title>
<desc id="strata-desc">Условный разрез: I внизу, IX вверху. VI и VII выделены как важные периоды для обсуждения поздней бронзы. Равная толщина не означает равную продолжительность; форма и уровни не являются обмером раскопа. Внутренние подразделения периодов здесь не показаны.</desc>
<defs><radialGradient id="s-bg"><stop stop-color="#14282e"/><stop offset="1" stop-color="#070f16"/></radialGradient></defs>
<style>
.phase{--layer:#234550;--edge:#6396a3;--label:#a8c8ce;--fill:#132d37}
.phase-vi,.phase-vii{--layer:#665139;--edge:#e6b87a;--label:#ffda9a;--fill:#382f26}
.phase.active,.phase[data-active="true"]{--layer:#347580;--edge:#9afff2;--label:#cdfff4;--fill:#20464d}
.phase .surface{fill:var(--layer);stroke:var(--edge)}.phase .face{fill:var(--fill);stroke:var(--edge)}.phase .joint{stroke:var(--edge);opacity:.3}.phase .marker{stroke:var(--edge)}.phase .label{fill:var(--label)}
</style>
