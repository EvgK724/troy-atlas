<g font-family="system-ui,-apple-system,sans-serif" font-weight="650">
<text x="116" y="363" fill="#c9efed" font-size="28">Эгейское море</text>
<text x="680" y="120" fill="#c9efed" font-size="28">Мраморное море</text>
