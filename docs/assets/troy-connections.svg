<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="connections-title connections-desc">
<title id="connections-title">Троя и морской проход между Эгейским и Мраморным морями</title>
<desc id="connections-desc">Схема взаимосвязей, не географическая карта. Дарданеллы соединяют Эгейское море с Мраморным. Троя находится на азиатской стороне близ южного входа в пролив. Береговые линии и расстояния условны; это не изображение берегов бронзового века.</desc>
<defs>
<radialGradient id="g-bg"><stop stop-color="#142e37"/><stop offset="1" stop-color="#070f16"/></radialGradient>
<linearGradient id="g-water" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#112d39"/><stop offset=".5" stop-color="#286474"/><stop offset="1" stop-color="#102c38"/></linearGradient>
<linearGradient id="g-land" x2="1" y2="1"><stop stop-color="#1a2f34"/><stop offset="1" stop-color="#0e1c25"/></linearGradient>
<pattern id="g-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5d99aa" stroke-opacity=".08"/></pattern>
<marker id="g-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L6 3.5 0 7" fill="none" stroke="#94ebe7" stroke-width="1.4"/></marker>
<filter id="g-glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
